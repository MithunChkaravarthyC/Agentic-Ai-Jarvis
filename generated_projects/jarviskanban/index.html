<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Kanban</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="kanban-board" class="container">
        <h1>Jarvis Kanban</h1>

            <div class="column" id="doing-column">Doing</div>
            <div class="column" id="done-column">Done</div>
        </div>
        <div class="cards">
            <!-- cards will be generated dynamically -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
