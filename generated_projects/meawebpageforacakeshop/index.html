<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cake_shop_name }}</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#products">Products</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <h1>{{ cake_shop_name }}</h1>
        <p>{{ description }}</p>
    </header>
    <main>
        <section id="products">
            <h2>Our Delicious Cakes</h2>
            <ul>
                {{# products_offered }}
                <li>{{ product }}</li>
                {{/ products_offered }}
            </ul>
        </section>
        <section id="images">
            <h2>Our Cake Creations</h2>
            <ul>
                {{# images_or_design_preferences }}
                <li><img src="{{ image }}" alt="{{ image_alt_text }}"></li>
                {{/ images_or_design_preferences }}
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; {{ cake_shop_name }} {{ year }}</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
